name: Bug report
description: Report a reproducible problem in BayarLab.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include real credentials, payment payloads, or customer data. Report suspected security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or scenario and a minimal synthetic example.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BayarLab version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact secrets, tokens, URLs with private query values, and personal data.
      render: text
